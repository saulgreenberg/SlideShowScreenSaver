name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish SlideShowScreenSaver/SlideShowScreenSaver.csproj -c Release -o release-output

      - name: Rename exe to scr
        shell: pwsh
        run: Rename-Item release-output\SlideShowScreenSaver.exe SlideShowScreenSaver.scr

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path release-output\* -DestinationPath SlideShowScreenSaver-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SlideShowScreenSaver-${{ github.ref_name }}.zip
          generate_release_notes: true
